<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Risk Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Academic Risk Predictor</h1>
        <form id="risk-form">
            <label>Attendance (%)</label>
            <input type="number" name="attendance" min="0" max="100" value="80" required>

            <label>Assignment Completion (%)</label>
            <input type="number" name="assignments" min="0" max="100" value="75" required>

            <label>Sleep Hours (per night)</label>
            <input type="number" name="sleep_hours" min="0" max="12" step="0.5" value="7" required>

            <button type="submit">Predict Risk</button>
        </form>
        <div id="result"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
